name: CI

# Pull requests only. Pushes to main are covered by the test step in
# deploy-pages.yml, so the two workflows never duplicate work.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # tsc -b runs as part of build, so this also type-checks the change.
      - run: pnpm build
